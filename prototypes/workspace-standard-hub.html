<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>项目规范</title>
  <style>
    :root{color-scheme:light;--ink:#1d1d1f;--muted:#73747a;--faint:#96979d;--line:rgba(60,60,67,.16);--blue:#0a84ff;--green:#31a76b;--panel:rgba(250,250,252,.96)}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;color:var(--ink);background:radial-gradient(circle at 20% 22%,rgba(179,208,242,.82),transparent 34%),radial-gradient(circle at 79% 74%,rgba(237,194,219,.68),transparent 34%),linear-gradient(145deg,#d8e3ee,#eee9ed 55%,#d5d8e3);font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}
    .menubar{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(246,246,248,.72);border-bottom:1px solid rgba(0,0,0,.08);backdrop-filter:saturate(180%) blur(24px);font-size:12px;box-shadow:0 1px 1px rgba(255,255,255,.55)}.menu-left,.menu-right{display:flex;align-items:center;gap:15px}.apple{font-size:15px}.menu-left b{font-weight:650}.menu-right{gap:10px}.menu-text{font-variant-numeric:tabular-nums}.menu-icon{height:23px;min-width:25px;display:grid;place-items:center;padding:0 5px;border:0;border-radius:5px;background:transparent;cursor:pointer}.menu-icon:hover,.menu-icon.active{background:rgba(80,80,86,.14)}.menu-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.menu-icon .status-dot{fill:#32c873;stroke:none}
    .popover{position:absolute;top:36px;right:58px;width:320px;overflow:hidden;border:1px solid rgba(0,0,0,.16);border-radius:12px;background:var(--panel);box-shadow:0 18px 48px rgba(28,31,38,.24),0 2px 8px rgba(28,31,38,.12);backdrop-filter:saturate(170%) blur(32px);transform-origin:calc(100% - 40px) top;transition:opacity .14s,transform .14s}.popover::before{content:"";position:absolute;top:-6px;right:34px;width:11px;height:11px;background:var(--panel);border-left:1px solid rgba(0,0,0,.13);border-top:1px solid rgba(0,0,0,.13);transform:rotate(45deg)}.popover.hidden{opacity:0;transform:scale(.96) translateY(-5px);pointer-events:none}
    .head{height:45px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line)}.head-copy{min-width:0;flex:1}.head-copy b,.head-copy span{display:block}.head-copy b{font-size:12px;font-weight:650}.head-copy span{margin-top:1px;color:var(--muted);font-size:9.5px}.enabled{width:8px;height:8px;border-radius:50%;background:var(--green)}.protect i{width:7px;height:7px;border-radius:50%;background:var(--green)}
    .plans{padding:7px 7px 6px;border-bottom:1px solid var(--line)}.plans-head{display:flex;align-items:center;justify-content:space-between;padding:0 5px 4px}.plans-head b{font-size:10.5px;font-weight:620}.plans-head span{color:var(--muted);font-size:9.5px}.plan-list{display:grid;gap:1px}.plan{width:100%;display:grid;grid-template-columns:25px minmax(0,1fr);align-items:center;min-height:42px;border-radius:7px;background:transparent}.plan:hover{background:rgba(120,120,128,.08)}.plan.active{background:rgba(10,132,255,.1)}.plan-check{width:16px;height:16px;display:grid;place-items:center;margin-left:6px;padding:0;border:1px solid #b8b9be;border-radius:50%;color:transparent;background:transparent;font-size:9px;font-weight:800;cursor:pointer}.plan.active .plan-check{border-color:var(--blue);color:#fff;background:var(--blue)}.plan-open{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;padding:5px 6px 5px 4px;border:0;background:transparent;text-align:left;cursor:pointer}.plan-copy{min-width:0}.plan-copy b{display:block;overflow:hidden;font-size:11px;font-weight:610;text-overflow:ellipsis;white-space:nowrap}.plan-copy p{display:block;overflow:hidden;margin:1px 0 0;color:var(--muted);font-size:9px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.plan-count{align-self:start;margin-top:2px;color:var(--muted);font-size:9px;white-space:nowrap}.plan-count i{margin-left:3px;color:#a3a4aa;font-style:normal;font-size:13px}
    .targets-title{display:flex;align-items:center;justify-content:space-between;padding:8px 11px 5px}.targets-title b{font-size:10.5px;font-weight:620}.targets-title span{color:var(--muted);font-size:9.5px}.targets{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,255,255,.74)}.target{min-height:44px;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 11px;border-bottom:1px solid var(--line)}.target:last-child{border-bottom:0}.client{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:#fff;background:#25262a;font-size:7.5px;font-weight:750}.client.claude{background:#ca7455}.target-copy{min-width:0}.target-line{display:flex;align-items:center;gap:4px}.target-line b{overflow:hidden;font-size:10.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.current{padding:1px 4px;border-radius:4px;color:#686a70;background:#ededf0;font-size:7.5px}.target-copy span{display:block;margin-top:1px;color:var(--muted);font-size:9px}.target-copy span.good{color:#258558}.switch{position:relative;width:30px;height:19px;padding:0;border:0;border-radius:999px;background:#d1d1d6;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1);cursor:pointer;transition:.16s}.switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:.16s cubic-bezier(.2,.9,.2,1.1)}.switch.on{background:#34c759}.switch.on::after{transform:translateX(11px)}.protect{height:34px;display:flex;align-items:center;padding:0 11px;color:var(--muted);font-size:9.5px}.protect>span:first-child{display:flex;align-items:center;gap:6px}.protect b{color:#55565c;font-weight:580}
    .detail-view{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;background:var(--panel);transform:translateX(100%);transition:transform .2s cubic-bezier(.2,.8,.2,1)}.detail-view.open{transform:translateX(0)}.detail-head{height:45px;display:grid;grid-template-columns:30px 1fr 30px;align-items:center;padding:0 8px;border-bottom:1px solid var(--line)}.detail-head b{text-align:center;font-size:11.5px;font-weight:630}.back{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;font-size:21px;cursor:pointer}.back:hover{background:rgba(120,120,128,.1)}.detail-meta{padding:9px 12px;color:var(--muted);font-size:9.5px;border-bottom:1px solid var(--line)}.detail-meta strong{display:block;margin-bottom:2px;color:var(--ink);font-size:12px}.category-list{background:rgba(255,255,255,.72)}.category-row{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 11px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}.category-row:hover{background:rgba(120,120,128,.08)}.category-row>span:first-child{min-width:0}.category-row b,.category-row code{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.category-row b{font-size:10.5px;font-weight:580}.category-row code{max-width:238px;margin-top:2px;color:var(--muted);font:8.5px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}.category-row .file-action{flex:0 0 auto;color:var(--muted);font-size:9px;white-space:nowrap}.category-row .file-action i{margin-left:3px;color:#9b9ca2;font-style:normal;font-size:13px}
    .toast{position:absolute;top:48px;left:50%;z-index:4;padding:7px 10px;border-radius:8px;color:#fff;background:rgba(35,36,40,.94);box-shadow:0 5px 18px rgba(0,0,0,.18);font-size:10.5px;opacity:0;transform:translate(-50%,-5px);transition:.16s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:520px){.menu-left .optional{display:none}.popover{right:10px;width:calc(100vw - 20px)}}
  </style>
</head>
<body>
  <header class="menubar" aria-label="macOS 菜单栏">
    <div class="menu-left"><span class="apple">●</span><b>Finder</b><span class="optional">文件</span><span class="optional">编辑</span><span class="optional">显示</span></div>
    <div class="menu-right"><span>⌁</span><span>◒</span><button class="menu-icon active" id="menuTrigger" aria-label="打开项目规范"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.4-2.8 8.1-7 10-4.2-1.9-7-5.6-7-10V6l7-3z"/><path d="m9 12 2 2 4-4"/><circle class="status-dot" cx="19" cy="5" r="2.6"/></svg></button><span class="menu-text">周五 11:28</span></div>
  </header>

  <section class="popover" id="popover" aria-label="项目规范菜单">
    <div class="head"><div class="head-copy"><b>项目规范</b><span>Project Standard</span></div><span class="enabled" title="已启用" aria-label="已启用"></span></div>
    <div class="plans"><div class="plans-head"><b>方案</b><span>3 个</span></div><div class="plan-list" id="planList"></div></div>
    <div class="targets-title"><b>本机接入</b><span id="appliedCount"></span></div>
    <div class="targets" id="targets"></div>
    <div class="protect"><span><i></i><span><b>自动发现</b> · 已监听 Codex / Claude 配置</span></span></div>
    <section class="detail-view" id="detailView" aria-hidden="true"><div class="detail-head"><button class="back" id="back" aria-label="返回">‹</button><b>方案内容</b><span></span></div><div id="detailContent"></div></section><div class="toast" id="toast"></div>
  </section>

  <script>
    const schemes={
      base:{name:'默认项目规范',items:27,counts:[1,6,4,5,3,4,4],summary:'Prompt · Rules · 记忆 · 项目 · Skills · MCP · 权限',targets:[['CX','Codex · ChatGPT 订阅','当前接入 · 7/7 生效',true,'codex'],['CX','Codex · OpenAI API Key','7/7 生效',true,'codex'],['CX','Codex · 公司 LLM Proxy','未应用',false,'codex'],['CL','Claude Code · Anthropic','7/7 生效',true,'claude']]},
      design:{name:'产品设计',items:21,counts:[1,5,4,4,3,2,2],summary:'Prompt · Rules · 记忆 · 项目 · Skills · MCP · 权限',targets:[['CX','Codex · ChatGPT 订阅','当前接入 · 7/7 生效',true,'codex'],['CX','Codex · OpenAI API Key','7/7 生效',true,'codex'],['CX','Codex · 公司 LLM Proxy','7/7 生效',true,'codex'],['CL','Claude Code · Anthropic','未应用',false,'claude']]},
      review:{name:'代码审查',items:18,counts:[1,5,2,3,3,2,2],summary:'Prompt · Rules · 记忆 · 项目 · Skills · MCP · 权限',targets:[['CX','Codex · ChatGPT 订阅','当前接入 · 未应用',false,'codex'],['CX','Codex · OpenAI API Key','7/7 生效',true,'codex'],['CX','Codex · 公司 LLM Proxy','未应用',false,'codex'],['CL','Claude Code · Anthropic','7/7 生效',true,'claude']]}
    };
    const categoryFiles=[['基础 Prompt','prompt.md'],['规范与 Rules','rules.md'],['记忆','memory.md'],['项目要求','requirements.md'],['Skills','skills/'],['Tools 与 MCP','tools-mcp.json'],['权限与 Hooks','permissions-hooks.json']];
    let current='base';
    const planList=document.getElementById('planList'),targets=document.getElementById('targets'),popover=document.getElementById('popover'),trigger=document.getElementById('menuTrigger'),detailView=document.getElementById('detailView'),detailContent=document.getElementById('detailContent');
    function render(){const s=schemes[current];planList.innerHTML=Object.entries(schemes).map(([id,plan])=>`<div class="plan ${id===current?'active':''}"><button class="plan-check" data-select="${id}" aria-label="设为当前方案：${plan.name}">✓</button><button class="plan-open" data-open="${id}" aria-label="查看方案内容：${plan.name}"><span class="plan-copy"><b>${plan.name}</b><p>${plan.summary}</p></span><span class="plan-count">${plan.items} 项 <i>›</i></span></button></div>`).join('');document.getElementById('appliedCount').textContent=`发现 ${s.targets.length} 个 · 开启 ${s.targets.filter(t=>t[3]).length}`;targets.innerHTML=s.targets.map((t,i)=>`<div class="target"><span class="client ${t[4]==='claude'?'claude':''}">${t[0]}</span><div class="target-copy"><div class="target-line"><b>${t[1]}</b>${t[2].startsWith('当前')?'<em class="current">当前</em>':''}</div><span class="${t[3]?'good':''}">${t[2].replace('当前接入 · ','')}</span></div><button class="switch ${t[3]?'on':''}" data-index="${i}" role="switch" aria-checked="${t[3]}" aria-label="${t[3]?'取消':'应用'} ${t[1]}"></button></div>`).join('')}
    function showToast(text){const toast=document.getElementById('toast');toast.textContent=text;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1500)}
    function openPlan(id){const s=schemes[id];detailContent.innerHTML=`<div class="detail-meta"><strong>${s.name}</strong>7 类 · ${s.items} 项</div><div class="category-list">${categoryFiles.map(([name,file],i)=>{const path=`.project-standard/schemes/${id}/${file}`;return `<button class="category-row" data-file="${path}" aria-label="打开 ${name} 文件"><span><b>${name}</b><code>${path}</code></span><span class="file-action">${s.counts[i]} 项 <i>↗</i></span></button>`}).join('')}</div>`;detailView.classList.add('open');detailView.setAttribute('aria-hidden','false')}
    planList.addEventListener('click',e=>{const selector=e.target.closest('[data-select]');if(selector){current=selector.dataset.select;render();return}const opener=e.target.closest('[data-open]');if(opener)openPlan(opener.dataset.open)});detailContent.addEventListener('click',e=>{const file=e.target.closest('[data-file]');if(file)showToast(`打开 ${file.dataset.file}`)});document.getElementById('back').addEventListener('click',()=>{detailView.classList.remove('open');detailView.setAttribute('aria-hidden','true')});targets.addEventListener('click',e=>{const button=e.target.closest('[data-index]');if(!button)return;const item=schemes[current].targets[Number(button.dataset.index)];item[3]=!item[3];item[2]=item[3]?(item[2].startsWith('当前')?'当前接入 · 7/7 生效':'7/7 生效'):(item[2].startsWith('当前')?'当前接入 · 未应用':'未应用');render();showToast(item[3]?'已应用并校验 7/7':'已取消应用')});trigger.addEventListener('click',()=>{popover.classList.toggle('hidden');trigger.classList.toggle('active');if(popover.classList.contains('hidden')){detailView.classList.remove('open');detailView.setAttribute('aria-hidden','true')}});render();
  </script>
</body>
</html>
